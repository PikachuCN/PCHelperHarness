[package]
name = "harness-python-plugin"
version = "0.1.0"
description = "Harness portable Python runtime plugin"
edition = "2021"

[lib]
name = "python"
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }
